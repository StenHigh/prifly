id: aif:schema/task
version: 1.1.0
$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [title, description]
additionalProperties: false
properties:
  title: {type: string, minLength: 1, maxLength: 400}
  description: {type: string, minLength: 1, maxLength: 12000}
  reference:
    type: string
    minLength: 1
    maxLength: 400
    description: >-
      Where this task is tracked outside Pri-Fly: an issue URL, a ticket id,
      whatever the team's tracker calls it. Optional, and read by nobody here —
      no step in this package opens a tracker. It exists so the address travels
      with the task instead of being retyped into the description, where the
      next reader cannot tell it apart from prose.
