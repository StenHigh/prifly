# Continues a Run of example:workflow/blocked-condition that stopped `partial`
# because the condition never held. It takes the source Run's request and the
# last obstacle as declared below -- nothing else -- and checks again. The
# check is its first stage on purpose: whether the condition holds now is
# for the workflow to establish, not for the engine to assume.
authoring: prifly-project-workflow/1
package:
  id: example:package/blocked-condition-continue
  version: 1.0.0
  description: Continue work that stopped on an absent condition.
  requires_core_protocol: "1"
  references:
    adapter: core:adapter/local-process@2.0.0
    policy: core:policy/local@3.0.0
    result: core:schema/step-result@2.0.0
id: example:workflow/blocked-condition-continue
version: 1.0.0
title: Continue work on a condition
inputs:
  request: {schema_ref: "{{schema_blocked-request}}"}
  previous_obstacle: {schema_ref: "{{schema_obstacle}}"}
outputs:
  result: {schema_ref: "{{schema_blocked-result}}", required_for: [succeeded]}
  obstacle: {schema_ref: "{{schema_obstacle}}", required_for: [partial]}
continuation:
  from_workflows: [example:workflow/blocked-condition]
  from_outcomes: [partial]
  inputs:
    request: {source_input: request}
    previous_obstacle: {stage: attempt, output: obstacle, outcome: partial}
entry: check
policy_ref: "{{policy}}"
limits: {max_step_instances: 1, max_control_transitions: 3}
stages:
  check:
    kind: step
    step_ref: "{{step_check-condition}}"
    input_bindings: {request: $inputs.request}
    on: {pass: done, blocked: stopped, fail: rejected}
    impossible_verdicts: [needs_revision, no_work]
    on_error: rejected
  done:
    kind: finish
    outcome: succeeded
    output_bindings: {result: $stages.check.result}
  stopped:
    kind: finish
    outcome: partial
    output_bindings: {obstacle: $stages.check.obstacle}
  rejected:
    kind: finish
    outcome: rejected

execution_bindings:
  steps:
    example:step/check-condition:
      executable: node
      args: [worker.mjs, check]
      files: {worker.mjs: files/worker.mjs}
      timeout_ms: 10000
      grace_ms: 100
      max_output_bytes: 1048576
