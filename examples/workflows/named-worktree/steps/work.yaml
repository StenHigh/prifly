authoring: prifly-step/1
id: example:step/work
version: 1.0.0
kind: worker
refs: {task: "{{schema_task}}"}
inputs:
  task: {schema_ref: task, required: true}
executor: {adapter_ref: "{{assisted_adapter}}", operation: session}
