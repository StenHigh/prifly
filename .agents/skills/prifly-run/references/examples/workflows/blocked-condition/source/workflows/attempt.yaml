# One attempt: check the condition; on blocked record the obstacle and end
# `partial`, which the repeat around this body runs again. It is a body and
# not an edge back to `check` because a stage graph is acyclic: a loop is
# always a bounded repeat.
authoring: prifly-workflow/1
schema_version: "6"
id: example:workflow/blocked-condition-attempt
version: 1.0.0
title: One attempt at the work
inputs:
  request: {schema_ref: "{{schema_blocked-request}}"}
outputs:
  result: {schema_ref: "{{schema_blocked-result}}", required_for: [succeeded]}
  obstacle: {schema_ref: "{{schema_obstacle}}", required_for: [partial]}
entry: check
policy_ref: "{{policy}}"
limits: {max_step_instances: 2, max_control_transitions: 6}
stages:
  check:
    kind: step
    step_ref: "{{step_check-condition}}"
    input_bindings: {request: $inputs.request}
    on: {pass: done, blocked: remedy, fail: rejected}
    impossible_verdicts: [needs_revision, no_work]
    on_error: rejected
  remedy:
    kind: step
    step_ref: "{{step_remedy}}"
    input_bindings: {obstacle: $stages.check.obstacle}
    on: {pass: again}
    impossible_verdicts: [fail, needs_revision, no_work, blocked]
    on_error: rejected
  done:
    kind: finish
    outcome: succeeded
    output_bindings: {result: $stages.check.result}
  again:
    kind: finish
    outcome: partial
    output_bindings: {obstacle: $stages.check.obstacle}
  rejected:
    kind: finish
    outcome: rejected
