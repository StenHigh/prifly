id: aif-evidence:schema/report
version: 1.0.0
$schema: https://json-schema.org/draft/2020-12/schema
type: object
required:
- round
- request_digest
- candidate
- session
- model_profile
- model
- checks
additionalProperties: false
properties:
  request_digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
  round:
    type: integer
    minimum: 1
    maximum: 10000
  candidate:
    type: object
    required:
    - algorithm
    - base_commit
    - head_commit
    - index_digest
    - files_digest
    - digest
    additionalProperties: false
    properties:
      algorithm:
        const: git-candidate/1
      base_commit:
        type: string
        pattern: ^[0-9a-f]{40}$
      head_commit:
        type: string
        pattern: ^[0-9a-f]{40}$
      index_digest:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
      files_digest:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
      digest:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
  session:
    enum:
    - separate
    - shared
    - unavailable
  model_profile:
    enum:
    - honoured
    - unavailable
    - declined
  model:
    type:
    - string
    - 'null'
    minLength: 1
    maxLength: 4000
  checks:
    type: array
    maxItems: 80
    items:
      type: object
      required:
      - id
      - status
      - result
      - reason
      - evidence
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,79}$
        status:
          enum:
          - executed
          - unavailable
          - excluded
          - not_applicable
        result:
          enum:
          - passed
          - failed
          - warnings
          - not_run
        reason:
          type: string
          maxLength: 4000
        evidence:
          type: array
          maxItems: 40
          items:
            type: object
            required:
            - method
            - tool
            - locator
            - observation
            - exit_code
            additionalProperties: false
            properties:
              method:
                enum:
                - code
                - command
                - browser
              tool:
                type: string
                minLength: 1
                maxLength: 4000
              locator:
                type: string
                minLength: 1
                maxLength: 4000
              observation:
                type: string
                minLength: 1
                maxLength: 4000
              exit_code:
                type:
                - integer
                - 'null'
