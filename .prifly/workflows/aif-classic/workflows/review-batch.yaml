authoring: prifly-workflow/1
schema_version: "4"
id: aif:workflow/review-batch
version: 1.3.0
title: Review and fix until nothing blocks or the declared limit is reached
refs:
  schema_implementation: "{{schema_implementation}}"
  schema_gate-result: "{{schema_gate-result}}"
  schema_warmup-handoff: "{{schema_warmup-handoff}}"
  schema_round-limit: "{{schema_round-limit}}"
  schema_feature-enabled: "{{schema_feature-enabled}}"
  workflow_review-once: "{{workflow_review-once}}"
  local_policy: "{{local_policy}}"
inputs:
  implementation: schema_implementation
  handoff: schema_warmup-handoff
  review_round_limit:
    schema_ref: schema_round-limit
    required: false
    configuration: {scope: project, default: 3}
  review_enabled:
    schema_ref: schema_feature-enabled
    required: false
    configuration: {scope: project, default: true}
outputs:
  implementation: {schema_ref: schema_implementation, required_for: [succeeded]}
  gate: {schema_ref: schema_gate-result, required_for: [partial]}
limits: {max_step_instances: 20, max_control_transitions: 160, max_parallelism: 1, max_child_depth: 2}
policy_ref: local_policy
features: {review: {input: review_enabled}}
# The switch lives here rather than in the root graph on purpose. When the root
# chose whether to call this workflow, the stage after it could not bind to its
# output — on the path that skipped it there was nothing to bind — so every
# later stage read the implementation from the implement step instead. A fix
# round's commit then never reached review or commit: a live Run reviewed a
# head two commits behind its own tree. Calling this workflow always, and
# letting it pass the input through when the gate is off, makes its output
# guaranteed on every path.
entry: choose
stages:
  choose:
    kind: choice
    selection: exclusive
    branches:
      - id: enabled
        predicate: {op: eq, left: $inputs.review_enabled, right: true}
        next: round
    default: unchanged
  unchanged:
    kind: finish
    outcome: succeeded
    output_bindings: {implementation: $inputs.implementation}
    description: The review gate is switched off for this project; the implementation passes through untouched.
  round:
    kind: repeat
    body_workflow_ref: workflow_review-once
    initial_bindings: {implementation: $inputs.implementation, handoff: $inputs.handoff}
    next_bindings: {implementation: $iteration.implementation, handoff: $inputs.handoff}
    continue_on: [partial]
    until: false
    max_iterations: 8
    limit_configuration: review_round_limit
    on_complete: {succeeded: passed, rejected: standing, no_work: unstarted}
    on_limit: exhausted
  passed:
    kind: finish
    outcome: succeeded
    output_bindings: {implementation: $stages.round.implementation}
  exhausted:
    kind: finish
    outcome: partial
    output_bindings: {gate: $stages.round.gate}
    description: The declared number of review rounds ran out with blockers still open.
  standing:
    kind: finish
    outcome: partial
    output_bindings: {gate: $stages.round.gate}
    description: A round found no safe fix, so the findings are reported unchanged.
  unstarted:
    kind: finish
    outcome: no_work
    description: A round could not run its step, so there is no gate result to report.
