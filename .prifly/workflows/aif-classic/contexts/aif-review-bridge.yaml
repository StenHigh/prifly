id: aif:context/aif-review-bridge
version: 1.13.0
media_type: text/markdown; charset=utf-8
text: |
  # Pri-Fly adapter for the pinned aif-review skill

  The following supporting context is the pinned upstream `aif-review` skill.
  Review the implementation as written. This step changes nothing: it declares
  no workspace effect, and its product is the gate result.

  The plan the change was built from is laid out for you, read-only, in the
  claimed workspace at the location `workspace-trees.json` names; "what the
  plan promised" below is judged against that file. It is the Run's doing,
  not the tree's history: read it, do not edit it, do not declare or report
  it as an output, and do not treat its presence, or its absence from git, as
  a finding. The engine takes it back after this step, and a write to it is
  refused as `effect_not_permitted`.

  Report findings honestly, including that a gate you could not run did not
  run. A gate that reports a pass it did not establish is worse than one that
  reports it could not check.

  A second reviewer read this change before you, in a session of its own, and
  its findings are your `challenge` input. They are claims, not findings, until
  you have checked each one against the tree — or better, by running it —
  and set its severity yourself: raise, lower or drop, collapse the ones that
  duplicate yours, and carry the ones that stand into `findings` marked as
  the second reviewer's. Its `checked` list is part of what this gate covered;
  say so. On a live Run the second reader found the real blocker of a round
  and three defects in the fix that followed, and invented nothing in nine
  findings — because every one was checked, not summed. `blocking` stays
  yours alone.

  A finding blocks when the change under review is wrong on its own terms: it
  does not do what the plan promised, it breaks something that worked, or it
  leaves the tree in a state the next reader cannot rely on. A finding that is
  real but about something else — debt that was already there, style, work
  beyond this change — does not block. Calling everything you found a warning is
  a decision and not a default: `blocking` is the only way this route can reach
  a repair, so a gate that never sets it turns the fix step off for good.

  The `implementation` you are given names the base and the head this Run last
  recorded, and the tree can be ahead of it: a Run resumed where it stopped is
  handed the same tree, with whatever the developer committed or left
  uncommitted while it stood. Judge the tree as it is — HEAD and the working
  tree — and take what changed from `git diff <base_commit>` plus untracked
  files, not from the list in the artifact. A head the artifact does not name is
  not a finding; a change you did not look at because the list omitted it is.

  Your tree is the whole branch, base included; the diff is only the part of
  it this Run changed. A finding about anything outside the diff — a method
  you did not see, a norm the change seems to break, a caller you expected —
  does not exist until you have looked for it in the tree and in the recent
  history of the touched paths (`git log` on them): cite the file or the
  commit that bears it out, or drop it. Absence from the diff is not absence
  from the project, and a base that moved an hour ago is still the base you
  judge against. Two fresh reviewers in a row reported as missing what the base
  had received two hours earlier, and read a deliberate exception to a norm as
  a defect; both were outside the diff, and both were in the tree.

  The supporting skill above sets this field by a rule of its own. Where that
  rule and this paragraph disagree, this adapter governs — and the reason is
  worth more than the authority: `status` is reported here and read by nothing,
  no route in this workflow branches on it, while `blocking` decides only
  whether a fix round runs, which is a smaller and cheaper thing than any
  question about holding a merge. So a result carrying `status: warnings`
  together with `blocking: true` is correct here, and under `gate_warnings: fix`
  or `stop` it is required — even where the supporting skill's own rule would
  never produce such a result, which is a difference to follow rather than a
  contradiction to repair.

  `decision_context.gate_warnings` says what this project does with findings
  that are real but do not block. It is answered before the Run starts, because
  an unattended Run has nobody to ask:

  - `ignore` — report warnings as findings and leave `blocking` false.
  - `fix` — treat them as work: set `blocking` true so the caller sends them to
    the fix step with the blockers.
  - `stop` — set `blocking` true as well, but say in the findings that these are
    warnings the developer chose to look at personally. The fix step reads the
    same value and will report them back unchanged instead of editing code.

  Your result is read by a bounded loop: the caller runs you again after a fix,
  and stops when nothing blocks or the declared number of rounds runs out. Do
  not run `/aif-fix`, commit, or decide what comes next.

  The graph, not this verdict, selects remediation. A normal `pass` carries the
  gate to its decision, and a `needs_revision` with a usable gate takes that
  same decision: `blocking` starts the fix round, while `blocking_owner_only`
  stops for the developer. Do not run `/aif-fix`, commit, or create a new gate
  yourself. Blocking travels in the `blocking` field of the `gate` artifact;
  use `needs_revision` only when no usable gate can be reported.

  One result is not a judgement of the work at all: that you could not judge
  it. Keep three states apart, because the graph routes them differently. A
  check that ran and failed against this tree is a finding about the work:
  `blocking` true, verdict `pass`, and the fix round takes it. Acceptance
  evidence that is missing or incomplete — a criterion nothing demonstrates, a
  test the change should have brought — is the same: a finding, `pass`, work
  for the fix step. A dependency a check needs that is not there — a database
  that does not answer, a service or network that is down, a runner that cannot
  start — says nothing about the work: return verdict `blocked`, with a gate
  whose `status` is `blocked`, `blocking` false, `suggested_next` `continue`,
  and findings that name what was unavailable, the command and the output that
  show it, and which checks it left unrun. `blocked` ends the Run with that gate
  in front of the developer; the check is repeated by `prifly project continue`
  once the dependency is back, not by a fix round with nothing to fix. It is not
  for a dependency this change broke — a migration that leaves the database
  unable to start is a finding — nor for a check you chose not to run, and
  `needs_revision` stays for a result you could not establish for any other
  reason. A real Run reported a database that had gone away as a failed gate
  with zero new test failures; the fix step found nothing to fix and the Run
  ended partial, blaming the work.

  This is one session. Where the skill reaches for a separate reviewer session,
  use one only if the host platform actually provides it; where it does not,
  do the work here. Never report a pass you could not establish because a
  session you expected was not there.

  `blocking_owner_only` says whether another fix round could change anything.
  Set it true only when every blocker still standing is outside what any fix
  step may touch: a decision the developer owns, a rule that is itself wrong,
  access this Run does not have. One blocker a fix round could close makes it
  false. Getting this wrong in the safe direction stops the loop and puts the
  findings in front of a person; getting it wrong the other way spends rounds
  that cannot succeed, which is what a real Run did — two rounds and forty
  minutes after the answer was already known.

  Warnings you are reporting because `gate_warnings` said to are not out of
  reach. `stop` means the developer means to read them, not that no fix step may
  touch them: the fix step is given them and reports them back unchanged, which
  is the whole of what `stop` does. A real Run set this field true on three such
  warnings and ended there, unattended, with nobody to decide. When you do set it
  true, name in the findings which blocker is out of reach and what puts it out
  of reach; a `true` nobody can check is how a Run stops for no reason.

  `suggested_next` is reported, never obeyed. Say `/aif-fix` when the findings
  are work for the fix step and `continue` otherwise. The skill computes a wider
  set of commands of its own — rules, architecture, roadmap, commit — and none of
  them name a stage of this route, so they have no value here to report.
