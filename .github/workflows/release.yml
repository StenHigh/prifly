name: release

# A protected semantic-version tag builds each platform natively, then one
# job behind the `release` environment signs the manifest and publishes the
# GitHub Release. No product gate is repeated here: the tag names a tree that
# already passed `verify`.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOTELEMETRY: off

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the linux/amd64 release binary
        env:
          PRIFLY_RELEASE_PUBLIC_KEY: ${{ vars.PRIFLY_RELEASE_PUBLIC_KEY }}
        run: |
          test -n "${PRIFLY_RELEASE_PUBLIC_KEY:-}"
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          mkdir release-inputs
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "-X github.com/stenhigh/prifly/internal/runtime.Version=${RELEASE_VERSION} -X github.com/stenhigh/prifly/internal/release.PublicKeyHex=${PRIFLY_RELEASE_PUBLIC_KEY}" -o release-inputs/prifly-linux-amd64 ./cmd/prifly
          release-inputs/prifly-linux-amd64 version
      - uses: actions/upload-artifact@v4
        with:
          name: prifly-linux-amd64
          path: release-inputs/prifly-linux-amd64
          if-no-files-found: error
          retention-days: 1

  build-darwin-arm64:
    # GitHub-hosted Apple Silicon runner: the darwin asset is built and
    # qualified natively, never cross-compiled from Linux.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and qualify the darwin/arm64 release binary natively
        env:
          PRIFLY_RELEASE_PUBLIC_KEY: ${{ vars.PRIFLY_RELEASE_PUBLIC_KEY }}
        run: |
          test -n "${PRIFLY_RELEASE_PUBLIC_KEY:-}"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          command -v cc
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          mkdir release-inputs
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags "-X github.com/stenhigh/prifly/internal/runtime.Version=${RELEASE_VERSION} -X github.com/stenhigh/prifly/internal/release.PublicKeyHex=${PRIFLY_RELEASE_PUBLIC_KEY}" -o release-inputs/prifly-darwin-arm64 ./cmd/prifly
          qualification="$(mktemp -d)"
          release-inputs/prifly-darwin-arm64 version
          release-inputs/prifly-darwin-arm64 init "$qualification/project"
          release-inputs/prifly-darwin-arm64 --project "$qualification/project" doctor
          rm -rf "$qualification"
      - uses: actions/upload-artifact@v4
        with:
          name: prifly-darwin-arm64
          path: release-inputs/prifly-darwin-arm64
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build-linux-amd64, build-darwin-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment carries the required reviewer: publication waits for an
    # explicit owner approval, and only this job may write repository contents.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v4
        with:
          path: release-inputs
          merge-multiple: true
      - name: Sign the manifest and assemble the release assets
        env:
          PRIFLY_RELEASE_SIGNING_KEY: ${{ secrets.PRIFLY_RELEASE_SIGNING_KEY }}
          PRIFLY_RELEASE_PUBLIC_KEY: ${{ vars.PRIFLY_RELEASE_PUBLIC_KEY }}
        run: |
          test -n "${PRIFLY_RELEASE_SIGNING_KEY:-}"
          test -n "${PRIFLY_RELEASE_PUBLIC_KEY:-}"
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          test -f release-inputs/prifly-linux-amd64
          test -f release-inputs/prifly-darwin-arm64
          mkdir release-assets
          go run ./cmd/release-build --asset linux/amd64=release-inputs/prifly-linux-amd64 --asset darwin/arm64=release-inputs/prifly-darwin-arm64 --installer scripts/install.sh --output release-assets --version "$RELEASE_VERSION" --public-key-hex "$PRIFLY_RELEASE_PUBLIC_KEY"
      - name: Publish the GitHub Release for the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Pri-Fly ${RELEASE_VERSION}" --notes "Signed stable release ${RELEASE_VERSION}. Assets: install.sh, release-manifest.json, release-manifest.sig, prifly-linux-amd64.tar.gz, prifly-darwin-arm64.tar.gz." release-assets/install.sh release-assets/release-manifest.json release-assets/release-manifest.sig release-assets/prifly-linux-amd64.tar.gz release-assets/prifly-darwin-arm64.tar.gz
