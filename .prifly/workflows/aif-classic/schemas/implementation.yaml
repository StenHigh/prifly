id: aif:schema/implementation
version: 1.1.0
$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [base_commit, head_commit, changed_files]
additionalProperties: false
properties:
  base_commit: {type: string, pattern: "^[0-9a-f]{40}$"}
  head_commit: {type: string, pattern: "^[0-9a-f]{40}$"}
  changed_files:
    type: array
    # A bound, not a budget: a mechanical change of 282 files could not be
    # reported under 200 and the Run was lost. The artifact is a file, not the
    # report command, and the gates judge the tree, not this list.
    maxItems: 10000
    items: {type: string, minLength: 1}
