authoring: prifly-workflow/1
schema_version: "4"
id: aif:workflow/improve-or-pass
version: 1.3.0
title: Improve the plan only when this project enables improvement
refs:
  schema_plan_manifest: "{{workspace_tree_manifest}}"
  schema_warmup-handoff: "{{schema_warmup-handoff}}"
  schema_feature-enabled: "{{schema_feature-enabled}}"
  workflow_improve-series: "{{workflow_improve-series}}"
  local_policy: "{{local_policy}}"
inputs:
  plan: schema_plan_manifest
  handoff: schema_warmup-handoff
  improve_enabled:
    schema_ref: schema_feature-enabled
    required: false
    configuration: {scope: project, default: true}
outputs:
  plan: {schema_ref: schema_plan_manifest, required_for: [succeeded]}
limits: {max_step_instances: 100, max_control_transitions: 800, max_parallelism: 1, max_child_depth: 4}
policy_ref: local_policy
features: {improve: {input: improve_enabled}}
entry: choose-improve
stages:
  choose-improve:
    kind: choice
    selection: exclusive
    branches:
      - id: enabled
        predicate: {op: eq, left: $inputs.improve_enabled, right: true}
        next: improve
    default: unchanged
  improve:
    kind: call
    workflow_ref: workflow_improve-series
    input_bindings: {plan: $inputs.plan, handoff: $inputs.handoff}
    on: {succeeded: changed, rejected: stopped}
  changed:
    kind: finish
    outcome: succeeded
    output_bindings: {plan: $stages.improve.plan}
  unchanged:
    kind: finish
    outcome: succeeded
    output_bindings: {plan: $inputs.plan}
  stopped: {kind: finish, outcome: rejected}
