id: aif-evidence:schema/gate
version: 1.0.0
$schema: https://json-schema.org/draft/2020-12/schema
type: object
required:
- gate
- status
- blocking
- blocking_owner_only
- findings
- suggested_next
additionalProperties: false
properties:
  gate:
    const: review
  status:
    enum:
    - passed
    - warnings
    - failed
    - blocked
  blocking:
    type: boolean
  blocking_owner_only:
    type: boolean
  findings:
    type: array
    maxItems: 240
    items:
      type: string
      minLength: 1
      maxLength: 4000
  suggested_next:
    enum:
    - continue
    - /aif-fix
