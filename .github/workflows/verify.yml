name: verify

# The product gates run for every branch push and pull request. Release tags
# never run them again: a tag is cut from a tree that already passed.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOTELEMETRY: off

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: .cache
          key: prifly-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: prifly-go-${{ runner.os }}-
      - name: Toolchain
        run: |
          go version
          python3 --version
          gcc --version | head -1
      - name: Product gates
        run: make ci-check GO="$(go env GOROOT)/bin/go"
      - name: End-to-end checks
        run: make e2e GO="$(go env GOROOT)/bin/go"
