authoring: prifly-step/2
id: aif:step/implement
version: 1.6.0
title: Run aif-implement against the accepted plan
kind: worker
inputs:
  plan: {schema_ref: "{{workspace_tree_manifest}}"}
  handoff: {schema_ref: "{{schema_warmup-handoff}}"}
outputs:
  implementation: {schema_ref: "{{schema_implementation}}", required_for: [pass]}
  plan: {schema_ref: "{{workspace_tree_manifest}}", required_for: [pass]}
executor: {adapter_ref: "{{assisted_adapter}}", operation: session}
instructions_ref: "{{context_aif-implement-bridge}}"
context_refs: ["{{context_aif-implement}}"]
effects: {class: workspace_write, retry_class: never}
session_limits: {active_timeout_ms: null}
result_schema_ref: "{{step_result_schema}}"
workspace_trees:
  - input_port: plan
    output_port: plan
    capture: "{{plan_capture}}"
