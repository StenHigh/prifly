# yaml-language-server: $schema=../../schemas/authoring/extension-v1.schema.json
# Complete reference for the optional extend.yaml beside one project workflow.
# Copy only the sections your project needs. Values are validated by the named
# workflow input schema during `prifly project compile`.

# Select one package profile declared in workflow.yaml. A profile supplies only
# that package's sealed YAML substitutions; it is not a Core runtime profile.
profile: standard

# Standing answers to the package's declared decisions: what the owner settled
# for this project and does not choose again at every launch. Each is validated
# against the decision catalog exactly as a flag is, sealed into the Run's
# decision sheet as project_default, and overridden by the matching flag
# (--decision-policy, --preflight-answer, --runtime-answer) for one Run without
# touching this file. A long text answer is a YAML block scalar.
answers:
  decision_policy: autonomous
  preflight:
    plan_tests: true
    gate_checks: |
      composer test -- --group=product
  runtime:
    improve_apply: all

# Set defaults for already declared project-scoped configuration inputs.
settings:
  build-or-pass:
    build_batch_limit: 2

# Turn off only named optional features declared in a workflow's `features` map.
# The workflow itself owns the enabled and bypass routes; this list never deletes
# a stage or rewrites bindings.
exclude: [improve, verify, review]

# Insert a project step into one exact direct route. `workflow` and `step` are
# short component names — the file name without its directory — never the full
# `id:` written inside those files. The insertion names the route it replaces
# rather than a point after a stage, so the tail of the graph cannot be silently
# detached: `from` keeps its route to the new step and the new step routes on to
# `to`. The inserted step may bind one input; a step that requires more than one
# belongs in a workflow graph you write yourself.
extensions:
  - id: lint-after-build
    workflow: build
    between: {from: build, to: commit}
    step: lint
    # Hand the inserted step one artifact a stage that already ran on this path
    # produced, instead of retyping it into the prompt. Written exactly as a
    # workflow stage writes it, `$stages.STAGE.PORT`, and checked exactly as an
    # authored binding is: compilation refuses a producer that has not run, an
    # output that stage does not have, and a schema the input cannot accept.
    # Every other input the step declares must be optional.
    input_bindings: {sources: $stages.build.artifact}
    on: {pass: commit}
    # Every verdict the inserted step can return is routed above or named here.
    # Sealing refuses an insertion that stays silent about one of them.
    impossible_verdicts: [fail, needs_revision, no_work]
