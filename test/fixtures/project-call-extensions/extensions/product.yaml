{
  "authoring": "prifly-extension/2",
  "extensions": [
    {
      "id": "quality-check",
      "workflow": "consumer",
      "call": "product",
      "between": {
        "from": "prepare",
        "to": "commit"
      },
      "input_bindings": {
        "configuration": "$stages.prepare.configuration",
        "ui": "$stages.prepare.ui",
        "ux": "$stages.prepare.ux"
      },
      "on": {
        "succeeded": "commit",
        "partial": "partial",
        "rejected": "rejected"
      },
      "on_error": "rejected"
    },
    {
      "id": "read-exports",
      "workflow": "consumer",
      "call": "product-consumer",
      "between": {
        "from": "quality-check",
        "to": "commit"
      },
      "input_bindings": {
        "gate": "$stages.quality-check.gate",
        "ui_report": "$stages.quality-check.ui_report",
        "ux_report": "$stages.quality-check.ux_report",
        "environment": "$stages.quality-check.environment",
        "release": "$stages.quality-check.release"
      },
      "on": {
        "succeeded": "commit",
        "partial": "partial",
        "rejected": "rejected"
      }
    }
  ],
  "resources": {
    "quality": {
      "limit": 1,
      "stages": [
        "quality-check"
      ]
    }
  }
}
