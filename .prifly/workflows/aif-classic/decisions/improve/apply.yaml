authoring: prifly-run-decision/1
id: improve_apply
title: Apply the proposed plan improvements
description: >-
  Decide what aif-improve does with the refinements it just presented. The
  upstream skill asks this before it edits anything; declared here, the answer
  is recorded in the Run instead of living only in a chat window.

  Taking a refinement changes what the Run was planned to build, so this stays
  scope-changing and no policy answers it on its own. An unattended Run does
  not need one to: the owner seals the answer before the Run starts with
  `project start --runtime-answer improve_apply=<declared choice>`, and the
  engine applies it the moment the step asks instead of waiting. That is the
  same person the wait was for, so the night is covered without calling a
  scope-changing question ordinary for every attended Run as well.
phase: runtime
required: false
automatic: false
choices:
  - {id: all, title: Apply all improvements, value: all}
  - {id: select, title: Choose which ones to apply, value: select}
  - {id: none, title: Keep the plan as it is, value: none}
sensitivity: scope-changing
destination: {kind: session_context, name: improve_apply}
