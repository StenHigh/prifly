id: aif:schema/implementation
version: 1.2.0
$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [base_commit, head_commit, changed_files]
additionalProperties: false
properties:
  base_commit: {type: string, pattern: "^[0-9a-f]{40}$"}
  head_commit: {type: string, pattern: "^[0-9a-f]{40}$"}
  changed_files:
    type: array
    # A bound, not a budget: a mechanical change of 282 files could not be
    # reported under 200 and the Run was lost. The artifact is a file, not the
    # report command, and the gates judge the tree, not this list.
    maxItems: 10000
    items: {type: string, minLength: 1}
  reports:
    description: Original project report refs. A ref does not attest applicability or success.
    type: array
    maxItems: 80
    uniqueItems: true
    items:
      type: object
      additionalProperties: false
      required: [artifact_id, revision, digest]
      properties:
        artifact_id: {type: string, pattern: '^[A-Za-z][A-Za-z0-9._:/-]{0,127}$'}
        revision: {type: integer, minimum: 1, maximum: 9007199254740991}
        digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
