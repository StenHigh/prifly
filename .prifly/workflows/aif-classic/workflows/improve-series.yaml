authoring: prifly-workflow/1
schema_version: "4"
id: aif:workflow/improve-series
version: 1.3.0
title: Continue only developer-approved improvement batches
refs:
  schema_plan_manifest: "{{workspace_tree_manifest}}"
  schema_warmup-handoff: "{{schema_warmup-handoff}}"
  schema_round-limit: "{{schema_round-limit}}"
  workflow_improve-batch: "{{workflow_improve-batch}}"
  local_policy: "{{local_policy}}"
inputs:
  plan: schema_plan_manifest
  handoff: schema_warmup-handoff
  improve_batch_limit:
    schema_ref: schema_round-limit
    required: false
    configuration: {scope: project, default: 3}
outputs:
  plan: {schema_ref: schema_plan_manifest, required_for: [succeeded]}
limits: {max_step_instances: 96, max_control_transitions: 768, max_parallelism: 1, max_child_depth: 3}
policy_ref: local_policy
entry: improve
stages:
  improve:
    kind: repeat
    body_workflow_ref: workflow_improve-batch
    initial_bindings: {plan: $inputs.plan, handoff: $inputs.handoff}
    next_bindings: {plan: $iteration.plan, handoff: $inputs.handoff}
    continue_on: [partial]
    until: false
    max_iterations: 8
    limit_configuration: improve_batch_limit
    on_complete: {succeeded: done, no_work: stopped}
    on_limit: stopped
  done:
    kind: finish
    outcome: succeeded
    output_bindings: {plan: $stages.improve.plan}
  stopped: {kind: finish, outcome: rejected}
