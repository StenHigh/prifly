name: qualify

# The pre-release qualification, run by hand on the commit about to be tagged:
# the race detector and the full end-to-end suite, at once. It used to be the
# manual race workflow plus an e2e run on every push; the owner moved both here
# on 2026-09-30 because they held every release back. scripts/tag-release.py
# refuses a commit without a green verify and a green qualify.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact candidate SHA; refuse a moved ref before tests
        type: string
        required: false
      force:
        description: Explicitly execute a fresh full batch
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Serialize this exact tested commit; a queued duplicate rechecks evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOTELEMETRY: off

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      execute: ${{ steps.check.outputs.execute }}
      source_run: ${{ steps.check.outputs.source_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Existing full batch
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          FORCE_CHECKS: ${{ inputs.force }}
        run: python3 -B scripts/release_checks.py --preflight qualify
  race:
    needs: preflight
    if: needs.preflight.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: .cache
          key: prifly-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: prifly-go-${{ runner.os }}-
      - name: Race detector suite
        run: make race GO="$(go env GOROOT)/bin/go"

  e2e:
    needs: preflight
    if: needs.preflight.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: .cache
          key: prifly-go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: prifly-go-${{ runner.os }}-
      - name: Toolchain
        run: |
          go version
          python3 --version
          gcc --version | head -1
      - name: End-to-end checks
        run: make e2e GO="$(go env GOROOT)/bin/go"
